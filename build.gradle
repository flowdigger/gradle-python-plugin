plugins {
    id 'java-gradle-plugin'
    id 'jacoco'
    id 'maven-publish'
    id 'signing'
    id 'org.owasp.dependencycheck' version '13.0.0'
    id 'com.github.spotbugs' version '6.1.0'
    id 'org.sonarqube' version '6.0.1.5171'
}

group = 'org.flowdigger.gradle'
version = '1.0.0'

ext {
    spotbugsEngineVersion = '4.8.6'
    findSecBugsVersion = '1.13.0'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation gradleTestKit()
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'
    spotbugsPlugins "com.h3xstream.findsecbugs:findsecbugs-plugin:${findSecBugsVersion}"
}

gradlePlugin {
    website = 'https://github.com/flowdigger/gradle-python-plugin'
    vcsUrl = 'https://github.com/flowdigger/gradle-python-plugin.git'

    plugins {
        pythonRunner {
            id = 'org.flowdigger.gradle.python'
            implementationClass = 'org.flowdigger.gradle.python.PythonRunnerPlugin'
            displayName = 'Python Runner Plugin'
            description = 'Run Python scripts with per-project virtual environment and requirements caching.'
            tags = ['python', 'virtualenv', 'automation', 'script-runner']
        }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'gradle-python-plugin-impl'

            pom {
                name = 'Python Plugin'
                description = 'Gradle plugin for Python project integration'
                url = 'https://github.com/flowdigger/gradle-python-plugin'

                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }

                developers {
                    developer {
                        id = 'flowdigger'
                        name = 'Flowdigger'
                    }
                }

                scm {
                    connection = 'scm:git:https://github.com/flowdigger/gradle-python-plugin.git'
                    developerConnection = 'scm:git:ssh://git@github.com/flowdigger/gradle-python-plugin.git'
                    url = 'https://github.com/flowdigger/gradle-python-plugin'
                }
            }
        }
    }

    repositories {
        mavenLocal()
    }
}

signing {
    def signingKey = providers.gradleProperty('signingKey').orNull
    def signingPassword = providers.gradleProperty('signingPassword').orNull
    def signingKeyId = providers.gradleProperty('signingKeyId').orNull
    def validKeyIdPattern = ~/(?i)^[0-9a-f]{8}([0-9a-f]{8})?$/
    def normalizedSigningKeyId = signingKeyId
            ?.trim()
            ?.replaceFirst(/^(?i)0x/, '')
    if (!(normalizedSigningKeyId ==~ validKeyIdPattern)) {
        normalizedSigningKeyId = null
    }
    if (signingKey && signingPassword) {
        if (normalizedSigningKeyId) {
            useInMemoryPgpKeys(normalizedSigningKeyId, signingKey, signingPassword)
        } else {
            useInMemoryPgpKeys(signingKey, signingPassword)
        }
    } else {
        useGpgCmd()
    }
    sign publishing.publications.mavenJava
}

// OWASP Dependency-Check configuration
dependencyCheck {
    format = 'HTML,JSON,XML'
    failBuildOnCVSS = 7.0
    suppressionFile = 'dependency-check-suppressions.xml'

    // NVD API key configuration (improves scan speed by 30-50%)
    // Get key from: https://nvd.nist.gov/developers/request-an-api-key
    nvd {
        apiKey = findProperty('org.owasp.dependencycheck.nvd.api.key') ?: System.getenv('NVD_API_KEY')
    }
}

// SpotBugs configuration
spotbugs {
    toolVersion = spotbugsEngineVersion
    ignoreFailures = true
    effort = com.github.spotbugs.snom.Effort.valueOf('DEFAULT')
    reportLevel = com.github.spotbugs.snom.Confidence.valueOf('MEDIUM')
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
    reports {
        html.required = true
        xml.required = false
    }
}

tasks.named('spotbugsMain') {
    reports {
        html.required = true
        xml.required = false
    }
}

tasks.matching { it.name == 'spotbugsTest' }.configureEach {
    enabled = false
}

// SonarQube configuration
sonar {
    properties {
        property "sonar.projectKey", "gradle-python-plugin"
        property "sonar.projectName", "Gradle Python Plugin"
        property "sonar.sourceEncoding", "UTF-8"
        property "sonar.java.source", "21"
    }
}

// Aggregate security scanning task
tasks.register('allSecurityChecks') {
    group = 'verification'
    description = 'Run all security and quality checks (Dependency-Check, SpotBugs, SonarQube)'
    dependsOn tasks.named('check')
    def dependencyCheckTask = tasks.findByName('dependencyCheck') ?: tasks.findByName('dependencyCheckAnalyze')
    if (dependencyCheckTask != null) {
        dependsOn dependencyCheckTask
    }
    dependsOn tasks.named('spotbugsMain')
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

jacoco {
    toolVersion = '0.8.12'
}


tasks.named('test') {
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    classDirectories.setFrom(files(sourceSets.main.output.classesDirs))
    sourceDirectories.setFrom(files(sourceSets.main.allSource.srcDirs))
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

tasks.named('jacocoTestCoverageVerification') {
    dependsOn tasks.named('jacocoTestReport')
    classDirectories.setFrom(files(sourceSets.main.output.classesDirs))
    sourceDirectories.setFrom(files(sourceSets.main.allSource.srcDirs))
    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.20
            }
        }
    }
}

tasks.register('coverage') {
    group = 'verification'
    description = 'Runs tests, generates JaCoCo report, and verifies minimum coverage threshold.'
    dependsOn tasks.named('jacocoTestCoverageVerification')
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}

tasks.register('stageCentralBundleRepo', Sync) {
    dependsOn tasks.named('publishMavenJavaPublicationToMavenLocal')
    def artifactBaseDir = file("${System.getProperty('user.home')}/.m2/repository/org/flowdigger/gradle/gradle-python-plugin-impl")
    def artifactVersionDir = file("${artifactBaseDir}/${project.version}")
    from(artifactVersionDir)
    into(layout.buildDirectory.dir("central-staging-repo/org/flowdigger/gradle/gradle-python-plugin-impl/${project.version}"))

    doFirst {
        if (!artifactVersionDir.exists()) {
            throw new GradleException("Expected local Maven artifact version directory not found: ${artifactVersionDir}")
        }
    }
}

tasks.register('generateCentralBundleChecksums') {
    dependsOn tasks.named('stageCentralBundleRepo')

    doLast {
        def stagedVersionDir = layout.buildDirectory
                .dir("central-staging-repo/org/flowdigger/gradle/gradle-python-plugin-impl/${project.version}")
                .get()
                .asFile
        if (!stagedVersionDir.exists()) {
            throw new GradleException("Expected staged version directory not found: ${stagedVersionDir}")
        }

        def checksum = { File file, String algorithm ->
            def digest = java.security.MessageDigest.getInstance(algorithm)
            file.withInputStream { input ->
                byte[] buffer = new byte[8192]
                int read
                while ((read = input.read(buffer)) != -1) {
                    digest.update(buffer, 0, read)
                }
            }
            digest.digest().collect { String.format('%02x', it & 0xff) }.join('')
        }

        stagedVersionDir.eachFileRecurse { file ->
            if (file.isFile() && !file.name.endsWith('.md5') && !file.name.endsWith('.sha1')) {
                new File(file.parentFile, "${file.name}.md5").text = "${checksum(file, 'MD5')}\n"
                new File(file.parentFile, "${file.name}.sha1").text = "${checksum(file, 'SHA-1')}\n"
            }
        }
    }
}

tasks.register('packageCentralBundle', Zip) {
    dependsOn tasks.named('generateCentralBundleChecksums')
    archiveBaseName.set('gradle-python-plugin')
    archiveVersion.set(project.version.toString())
    archiveClassifier.set('central-bundle')
    destinationDirectory.set(layout.buildDirectory.dir('central-bundle'))
    from(layout.buildDirectory.dir('central-staging-repo'))
}
