plugins {
    id 'java-gradle-plugin'
    id 'jacoco'
    id 'org.flowdigger.maven-publish'
        id 'checkstyle'
    id 'org.owasp.dependencycheck' version '13.0.0'
    id 'org.flowdigger.dependency-check'
    id 'com.github.spotbugs' version '6.1.0'
    id 'org.sonarqube' version '6.0.1.5171'
}

group = 'org.flowdigger.gradle'
version = '1.0.2'

checkstyle {
    toolVersion = '10.26.1'
    configFile = file('checkstyle.xml')
}

ext {
    spotbugsEngineVersion = '4.8.6'
    findSecBugsVersion = '1.13.0'
}

java {
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation gradleTestKit()
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'
    spotbugsPlugins "com.h3xstream.findsecbugs:findsecbugs-plugin:${findSecBugsVersion}"
}

gradlePlugin {
    website = 'https://github.com/flowdigger/gradle-python-plugin'
    vcsUrl = 'https://github.com/flowdigger/gradle-python-plugin.git'

    plugins {
        pythonRunner {
            id = 'org.flowdigger.python'
            implementationClass = 'org.flowdigger.gradle.python.PythonRunnerPlugin'
            displayName = 'Python Runner Plugin'
            description = 'Run Python scripts with per-project virtual environment and requirements caching.'
            tags = ['python', 'virtualenv', 'automation', 'script-runner']
        }
    }
}

publishing {
    publications.withType(MavenPublication).configureEach {
        pom {
            name = 'Python Plugin'
            description = 'Gradle plugin for Python project integration'
            url = 'https://github.com/flowdigger/gradle-python-plugin'

            licenses {
                license {
                    name = 'MIT License'
                    url = 'https://opensource.org/licenses/MIT'
                }
            }

            developers {
                developer {
                    id = 'flowdigger'
                    name = 'Flowdigger'
                }
            }

            scm {
                connection = 'scm:git:https://github.com/flowdigger/gradle-python-plugin.git'
                developerConnection = 'scm:git:ssh://git@github.com/flowdigger/gradle-python-plugin.git'
                url = 'https://github.com/flowdigger/gradle-python-plugin'
            }
        }
    }
}

// OWASP Dependency-Check configuration
def dependencyCheckSuppression = file('dependency-check-suppressions.xml')

// SpotBugs configuration
spotbugs {
    toolVersion = spotbugsEngineVersion
    ignoreFailures = true
    effort = com.github.spotbugs.snom.Effort.valueOf('DEFAULT')
    reportLevel = com.github.spotbugs.snom.Confidence.valueOf('MEDIUM')
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
    reports {
        html.required = true
        xml.required = false
    }
}

tasks.named('spotbugsMain') {
    reports {
        html.required = true
        xml.required = false
    }
}

tasks.matching { it.name == 'spotbugsTest' }.configureEach {
    enabled = false
}

// SonarQube configuration
sonar {
    properties {
        property "sonar.projectKey", "gradle-python-plugin"
        property "sonar.projectName", "Gradle Python Plugin"
        property "sonar.sourceEncoding", "UTF-8"
        property "sonar.java.source", "21"
    }
}

// Aggregate security scanning task
tasks.register('allSecurityChecks') {
    group = 'verification'
    description = 'Run all security and quality checks (Dependency-Check, SpotBugs, SonarQube)'
    dependsOn tasks.named('check')
    def dependencyCheckTask = tasks.findByName('dependencyCheck') ?: tasks.findByName('dependencyCheckAnalyze')
    if (dependencyCheckTask != null) {
        dependsOn dependencyCheckTask
    }
    dependsOn tasks.named('spotbugsMain')
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

jacoco {
    toolVersion = '0.8.12'
}


tasks.named('test') {
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    classDirectories.setFrom(files(sourceSets.main.output.classesDirs))
    sourceDirectories.setFrom(files(sourceSets.main.allSource.srcDirs))
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

tasks.named('jacocoTestCoverageVerification') {
    dependsOn tasks.named('jacocoTestReport')
    classDirectories.setFrom(files(sourceSets.main.output.classesDirs))
    sourceDirectories.setFrom(files(sourceSets.main.allSource.srcDirs))
    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.20
            }
        }
    }
}

tasks.register('coverage') {
    group = 'verification'
    description = 'Runs tests, generates JaCoCo report, and verifies minimum coverage threshold.'
    dependsOn tasks.named('jacocoTestCoverageVerification')
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}
